# =============================================================================
# IONSEC node2shell detector — ModSecurity v2 / libmodsecurity v3 / Coraza drop-in
# CVE-2026-111497 (Node2Shell) — Brotli request bodies reaching node:zlib, aiohttp ...
# Compiled: 2026-10-24 · Author: IONSEC · File: ionsec-node2shell-dropin.conf
# =============================================================================
#
# DOCUMENTED GAP THIS FILE FILLS:
#   As of 2026-10-24 the OWASP ModSecurity Core Rule Set has NO Node2Shell /
#   CVE-2026-111497 rule: a repo-scoped code search (research brief section 6)
#   found none in OWASP CRS, nor in Emerging Threats, Snort/Talos, SigmaHQ,
#   Elastic detection-rules, Nuclei templates, signature-base, Yara-Rules or
#   Corelight. The only inbound protections are inside managed WAFs: Imperva and
#   Vercel rules (no public IDs; Vercel's were deployed 21 Oct for every project),
#   Indusface AppTrana (22 Oct: blocks Brotli request bodies including list
#   variants like "gzip, br", and duplicate Content-Encoding headers). Cloudflare's
#   WAF changelog through 22 Oct names no CVE-2026-111497 / Node2Shell / Brotli rule.
#   This is a SHIPPED drop-in that complements CRS; it is not a CRS rule.
#
# INBOUND ONLY — READ THIS:
#   ModSecurity / Coraza inspects requests entering your applications. It cannot
#   see the second Node2Shell path: responses your application FETCHES (built-in
#   fetch(), axios, got, node-fetch 3, needle; webhooks, link previews, image
#   proxies, crawlers, SSR of user-supplied URLs, npm). A malicious server can
#   answer Content-Encoding: br whatever the client asked for. Vercel states the same
#   limit for its WAF rules. Use the egress snippets in ../edge/ and patch:
#   Node.js 22.23.4 / 24.22.1 / 26.12.1, Bun 1.4.4, brotli 1.0.10 / 1.1.1 / 1.2.1.
#
# WHAT IT DOES (all phase 1: decisions are taken on request headers, before a single
# body byte is forwarded to the backend, so no decoder ever runs on a blocked request):
#   1026111401  default mode setter (tx.node2shell_mode = detect unless set earlier)
#   1026111402  ALLOWLIST HOOK - commented example (path + source address)
#   1026111403  ALLOWLIST HOOK - commented example (shared-secret header)
#   1026111410  Content-Encoding contains the token br (any case, also inside lists)  N2S-11
#   1026111411  more than one Content-Encoding header (connectors that keep duplicates) N2S-13
#   1026111412  Content-Encoding value is a comma list (httpd merges duplicates)       N2S-13
#   1026111413  Node2Shell PoC / checker user-agents                                    N2S-08/09/10
#   1026111420  ENFORCE in block mode: 415 when 1026111410-1026111412 matched
#   1026111421  ENFORCE in block mode: 403 when 1026111413 matched
#
# RULE-ID RANGE (private):
#   1026111400-1026111499, following the convention of the php2shell drop-in
#   ("1026" + CVE digits): php2shell uses 1026109601-1026109610, so there is no
#   overlap and both files can be included together. 1026111400 is reserved for
#   your own mode override line (below). 1026111497 - the "CVE-shaped" number other
#   community examples are most likely to use - is deliberately left unused.
#   All IDs are < 2^31 (safe for v2, v3 and Coraza).
#
# MODE SWITCH: tx.node2shell_mode = detect (default) | block
#   detect: every detection rule logs; nothing is blocked.
#   block : additionally 415 Unsupported Media Type for the Content-Encoding rules and
#           403 Forbidden for the user-agent rule.
#   Set block mode BEFORE this file is included (e.g. next to crs-setup.conf):
#     SecAction "id:1026111400,phase:1,pass,nolog,t:none,setvar:'tx.node2shell_mode=block'"
#   SecRuleEngine must be On; with SecRuleEngine DetectionOnly nothing is denied.
#
# WHY 415 (Content-Encoding rules):
#   It is the status the Node ecosystem already answers for request codings it does
#   not support: body-parser 1.x / Express 4 return 415 for br, body-parser 2.x
#   returns 415 for every coding when inflate is false, inflation and
#   @fastify/compress return 415 for unsupported codings. Clients and monitoring see
#   a familiar, non-retryable "coding not supported" answer instead of a generic WAF
#   403. (RFC 9110 15.5.16: for an unsupported content coding the server ought to
#   list acceptable codings in Accept-Encoding; ModSecurity cannot add a response
#   header on deny portably - the edge and app snippets do.)
#
# ALLOWLIST (known legitimate Brotli senders):
#   The Apify JavaScript API client compresses request bodies of 1,024 bytes or more
#   with brotli by default (docs.apify.com; brief section 5.5). If you operate or
#   proxy an Apify-API-shaped endpoint, allowlist it narrowly - by path AND source
#   address - and only in front of a patched decoder. Prefer fixing the sender:
#   new ApifyClient({ compression: 'gzip' }) is a documented client option. A header
#   allowlist is forgeable; if you must use one, require a long random shared secret
#   your own client sends, never a User-Agent. The allowlist sets
#   tx.node2shell_allow=1; every detection rule checks it first.
#
# REQUIREMENTS + CAVEATS:
#   - No SecRequestBodyAccess needed: header-only rules.
#   - Duplicate headers depend on the connector. libmodsecurity v3 (nginx connector)
#     and Coraza add every header instance, so &REQUEST_HEADERS:Content-Encoding
#     counts them (1026111411). Apache httpd merges repeated request headers into one
#     comma-separated value before ModSecurity v2 sees them, so on httpd the count is
#     1 and 1026111412 (comma list) carries the duplicate logic; the br token is still
#     found inside the merged value by 1026111410.
#   - TLS must terminate at or before the WAF; HTTP/2 headers arrive the same way.
#   - Behind a CDN/LB, REMOTE_ADDR is the proxy: restore the client address
#     (mod_remoteip / real_ip / X-Forwarded-For handling) before IP allowlisting.
#   - A WAF is a mitigation layer. Patching the runtime or library decoder is the fix;
#     no npm or PyPI package upgrade fixes the decoder by itself.
#   - Fingerprints are copied from the IONSEC research brief (N2S ids per rule);
#     provenance (VERBATIM / DERIVED) is stated per rule. Nothing is invented.
# =============================================================================

# --- 1026111401 — default mode: detect (unless tx.node2shell_mode was set earlier)
SecRule &TX:node2shell_mode "@eq 0" \
    "id:1026111401,phase:1,pass,nolog,t:none,\
    setvar:'tx.node2shell_mode=detect'"

# --- 1026111402 / 1026111403 — ALLOWLIST HOOK (disabled examples) ------------------
# Uncomment and adapt ONE of them. They must stay above the detection rules.
#
# (a) path + source address (e.g. an internal Apify-API-compatible endpoint fed by
#     known workers). 192.0.2.0/24 is a documentation range - replace it.
# SecRule REQUEST_FILENAME "@beginsWith /v2/" \
#     "id:1026111402,phase:1,pass,nolog,t:none,chain"
#     SecRule REMOTE_ADDR "@ipMatch 192.0.2.10,192.0.2.11" \
#         "t:none,setvar:'tx.node2shell_allow=1'"
#
# (b) shared-secret header sent only by your own client (rotate it; never a User-Agent)
# SecRule REQUEST_HEADERS:X-Br-Upload-Key "@streq REPLACE-WITH-A-LONG-RANDOM-SECRET" \
#     "id:1026111403,phase:1,pass,nolog,t:none,setvar:'tx.node2shell_allow=1'"

# --- 1026111410 — Content-Encoding contains the br token ---------------------------
# N2S-11, DERIVED: Express 5 / body-parser 2.x decode br request bodies by default
# (inflate defaults to true; expressjs.com migrating-to-5 guide); co-body, koa-body,
# @koa/bodyparser, @fastify/compress, Nest 11+, Apollo standalone and aiohttp do too.
# Match rules from the vendor workarounds (Aikido, Indusface): case-insensitive and
# inside lists. Token boundary = start/end, whitespace, comma or semicolon, so "br",
# "BR", "gzip, br" and "br ; x" match while "brotli" and "x-br" do not. Every
# instance of a repeated header is checked.
SecRule &TX:node2shell_allow "@eq 0" \
    "id:1026111410,phase:1,pass,log,auditlog,t:none,severity:'WARNING',\
    msg:'Node2Shell: request body declared Brotli-encoded (Content-Encoding br) (CVE-2026-111497)',\
    logdata:'Content-Encoding: %{MATCHED_VAR}',\
    tag:'cve-2026-111497',tag:'node2shell',tag:'n2s-11',tag:'ionsec-node2shell-detector',\
    chain"
    SecRule REQUEST_HEADERS:Content-Encoding "@rx (?:^|[\s,])br(?:[\s,;]|$)" \
        "t:none,t:lowercase,setvar:'tx.node2shell_ce_hit=1'"

# --- 1026111411 — more than one Content-Encoding header ----------------------------
# N2S-13, VERBATIM vendor logic (Indusface AppTrana, 22 Oct 2026: blocks duplicate
# Content-Encoding headers). Works where the connector keeps duplicates
# (libmodsecurity v3 + nginx, Coraza). See 1026111412 for Apache httpd.
SecRule &TX:node2shell_allow "@eq 0" \
    "id:1026111411,phase:1,pass,log,auditlog,t:none,severity:'WARNING',\
    msg:'Node2Shell: duplicate Content-Encoding request headers (CVE-2026-111497 parser-differential shape)',\
    logdata:'Content-Encoding header count: %{MATCHED_VAR}',\
    tag:'cve-2026-111497',tag:'node2shell',tag:'n2s-13',tag:'ionsec-node2shell-detector',\
    chain"
    SecRule &REQUEST_HEADERS:Content-Encoding "@gt 1" \
        "t:none,setvar:'tx.node2shell_ce_hit=1'"

# --- 1026111412 — Content-Encoding value is a comma list ----------------------------
# N2S-13, DERIVED: Apache httpd merges repeated request headers into one
# comma-separated value before ModSecurity v2 sees them, so a duplicate arrives as a
# list. Indusface's logic also blocks list variants ("gzip, br"). Stacked request
# codings are rare, and the Node and aiohttp decoders accept a single coding only.
SecRule &TX:node2shell_allow "@eq 0" \
    "id:1026111412,phase:1,pass,log,auditlog,t:none,severity:'NOTICE',\
    msg:'Node2Shell: stacked or merged Content-Encoding request value (CVE-2026-111497 parser-differential shape)',\
    logdata:'Content-Encoding: %{MATCHED_VAR}',\
    tag:'cve-2026-111497',tag:'node2shell',tag:'n2s-13',tag:'ionsec-node2shell-detector',\
    chain"
    SecRule REQUEST_HEADERS:Content-Encoding "@contains ," \
        "t:none,setvar:'tx.node2shell_ce_hit=1'"

# --- 1026111413 — Node2Shell PoC / checker user-agents ------------------------------
# VERBATIM strings (brief section 7):
#   N2S-08 starts with "Node2ShellChecker/"  (completetech-security/node2shell-check)
#   N2S-09 "Mozilla/5.0 (compatible; security-scanner)"  (Ghost-Bx1 poc.py:272)
#   N2S-10 "cve-2026-111497-verify"  (brief: repo UNCONFIRMED; IONSEC saw it only in
#          CaterMaoZi/CVE-2026-111497-POC tools/verify_brotli.py, used for downloads
#          from nodejs.org - an inbound hit is unexpected)
# Case-sensitive on purpose (exact tool strings).
SecRule &TX:node2shell_allow "@eq 0" \
    "id:1026111413,phase:1,pass,log,auditlog,t:none,severity:'NOTICE',\
    msg:'Node2Shell: PoC or checker user-agent (CVE-2026-111497 scanning)',\
    logdata:'User-Agent: %{MATCHED_VAR}',\
    tag:'cve-2026-111497',tag:'node2shell',tag:'n2s-08',tag:'n2s-09',tag:'n2s-10',tag:'ionsec-node2shell-detector',\
    chain"
    SecRule REQUEST_HEADERS:User-Agent "@rx ^(?:Node2ShellChecker/|Mozilla/5\.0 \(compatible; security-scanner\)$|cve-2026-111497-verify$)" \
        "t:none,setvar:'tx.node2shell_ua_hit=1'"

# --- 1026111420 — ENFORCE (block mode): 415 for the Content-Encoding rules ----------
SecRule TX:node2shell_ce_hit "@eq 1" \
    "id:1026111420,phase:1,deny,status:415,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'Node2Shell: request rejected (415) - Brotli, duplicate or stacked Content-Encoding (CVE-2026-111497)',\
    tag:'cve-2026-111497',tag:'node2shell',tag:'ionsec-node2shell-detector',\
    chain"
    SecRule TX:node2shell_mode "@streq block" \
        "t:none,t:lowercase"

# --- 1026111421 — ENFORCE (block mode): 403 for the user-agent rule -----------------
SecRule TX:node2shell_ua_hit "@eq 1" \
    "id:1026111421,phase:1,deny,status:403,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'Node2Shell: request rejected (403) - PoC or checker user-agent (CVE-2026-111497)',\
    tag:'cve-2026-111497',tag:'node2shell',tag:'ionsec-node2shell-detector',\
    chain"
    SecRule TX:node2shell_mode "@streq block" \
        "t:none,t:lowercase"

# --- END ionsec-node2shell-dropin.conf — next free ID: 1026111422 (1026111497 stays unused) ---
