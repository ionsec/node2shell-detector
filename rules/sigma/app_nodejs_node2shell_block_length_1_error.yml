# =====================================================================
# IONSEC node2shell detector — SIGMA / Node.js and Bun application logs + stack traces
# CVE-2026-111497 (Node2Shell) — unpatched decoder error on the trigger seed (N2S-17, VERBATIM + DERIVED brotli 1.0.x rendering, weak)
# =====================================================================
title: Brotli Decoder Error ERR__ERROR_FORMAT_BLOCK_LENGTH_1 - Possible Node2Shell Probe Against Unpatched Decoder (CVE-2026-111497)
id: 4e52fc1d-b1a0-4bc2-8d85-812bca2a44ca
status: experimental
description: |
    Detects N2S-17: the Brotli decoder error BLOCK_LENGTH_1 (-9). Per Bun
    issue oven-sh/bun#46352, unpatched decoders (Bun 1.3.14 / 1.4.2 and
    unpatched Node.js) return BLOCK_LENGTH_1 on the 22-byte regression
    vector where a patched decoder returns BLOCK_SWITCH (-17). In Node the
    code is rendered 'ERR__ERROR_FORMAT_BLOCK_LENGTH_1' ("ERR_" + the
    upstream error name).

    Provenance:
      - keywords_prefixed - N2S-17, VERBATIM string (P+D), the rendering of
        brotli 1.1.0 and later.
      - keywords_brotli_1_0_x - 'ERR_BLOCK_LENGTH_1', DERIVED: brotli 1.0.x
        builds BrotliDecoderErrorString() with "return #NAME;" (no
        "_ERROR_FORMAT_" prefix; checked in the google/brotli tags v1.0.3 and
        v1.0.9, confirmed by the IONSEC coordinator). Node 12-16 bundle brotli
        1.0.9, and a Node linked to an unpatched 1.0.x system library (for
        example Debian bookworm's nodejs on libbrotli1 before the
        1.0.9-2+deb12u1 update) builds "ERR_" + "BLOCK_LENGTH_1". Not yet
        observed in a log capture.

    WEAK on its own: ordinary corrupt Brotli input produces the same error,
    and errno -9 is also EBADF. Its value is correlation: the same source
    sending Content-Encoding br bodies (N2S-11), the seed on the wire
    (Suricata 1006610-1006612), or a node/bun crash shortly after (N2S-18) on
    a host that is not patched.
references:
    - https://github.com/oven-sh/bun/issues/46352
    - https://nodejs.org/en/blog/vulnerability/october-2026-security-releases
    - https://github.com/google/brotli/commit/0ed4268a4401abcb4472096340477cf4af7d1a2b
author: IONSEC
date: 2026-10-24
modified: 2026-10-24
tags:
    - attack.initial-access
    - attack.t1190
    - cve.2026-111497
logsource:
    category: application
    product: nodejs
detection:
    keywords_prefixed:
        - 'ERR__ERROR_FORMAT_BLOCK_LENGTH_1'
        - '_ERROR_FORMAT_BLOCK_LENGTH_1'
    keywords_brotli_1_0_x:
        # DERIVED: the brotli 1.0.x error-name table has no "_ERROR_FORMAT_" prefix
        - 'ERR_BLOCK_LENGTH_1'
    condition: 1 of keywords_*
falsepositives:
    - 'Any truncated or corrupt Brotli body or response (broken clients, bad caches, fuzzing)'
    - 'Behavioural self-tests on unpatched runtimes'
level: low
