# =====================================================================
# IONSEC node2shell detector — SIGMA / file-event (Linux)
# CVE-2026-111497 (Node2Shell) — public lab payload marker file (N2S-20, VERBATIM, lab marker)
# =====================================================================
title: Node2Shell Public Lab Marker File /tmp/pwn_marker.txt Created (CVE-2026-111497)
id: 41d44453-96e2-4336-aa6a-8dc088d6ada2
status: experimental
description: |
    Detects N2S-20: creation of /tmp/pwn_marker.txt, the marker file written
    by the payload of the TheFool-TAROT/CVE-2026-111497-brotli-pwn lab.

    Provenance: N2S-20, VERBATIM path (P). Lab marker, trivially renamed by
    anyone who edits the payload, hence the low level: a hit means that
    payload ran unmodified on this host (a lab, a red-team exercise, or
    someone reusing the public chain as-is). The endswith form also catches
    the path when a host sensor sees it through a container overlay
    (.../merged/tmp/pwn_marker.txt).
references:
    - https://github.com/TheFool-TAROT/CVE-2026-111497-brotli-pwn
author: IONSEC
date: 2026-10-24
modified: 2026-10-24
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - cve.2026-111497
logsource:
    category: file_event
    product: linux
detection:
    sel_marker:
        TargetFilename|endswith: '/tmp/pwn_marker.txt'
    condition: sel_marker
falsepositives:
    - 'Internal training or red-team runs of the public lab'
level: low
