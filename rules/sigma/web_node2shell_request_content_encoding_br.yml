# =====================================================================
# IONSEC node2shell detector — SIGMA / webserver + WAF + reverse-proxy request logs
# CVE-2026-111497 (Node2Shell) — request body declared Brotli (N2S-11, DERIVED, hunting)
# =====================================================================
title: HTTP Request Body Declared Brotli-Encoded (Content-Encoding br) - Node2Shell Hunting (CVE-2026-111497)
id: 73562698-212c-4098-8fcc-25ef3580815d
status: experimental
description: |
    Hunting rule for N2S-11: a request whose Content-Encoding header carries
    the token "br" (any case, alone or inside a list such as "gzip, br") and
    that carries a body. This is the inbound delivery vector of
    CVE-2026-111497 (Node2Shell, out-of-bounds write in the Google Brotli C
    decoder reached through node:zlib). Decoders that act on it by default
    (brief section 5.1): Express 5 / body-parser 2.x built-in parsers
    (inflate defaults to true), co-body (Koa) once it resolves inflation
    2.1.0, @koa/bodyparser, koa-body, @fastify/compress once registered,
    Nest 11+ on Express 5, Apollo Server standalone, Strapi 5, Parse Server 9,
    and Python aiohttp servers with Brotli installed. One unauthenticated
    request reaches the decoder.

    Provenance (brief section 7):
      - N2S-11, DERIVED: Express 5 / body-parser 2.x decode request bodies
        whose Content-Encoding is br (expressjs.com migrating-to-5 guide;
        inflate default true). Matching the token case-insensitively and
        inside lists follows the vendor workarounds (Aikido; Indusface AppTrana
        blocks list variants such as "gzip, br").
      - The body-presence test (POST/PUT/PATCH/DELETE, a Content-Length above
        zero, or chunked framing) is IONSEC noise reduction, DERIVED from the
        decoders keying on body presence rather than on the method.

    Browsers never compress request bodies on their own, so the base rate is
    low; the level stays low because legitimate senders exist (see
    falsepositives). Triage hint, DERIVED from the Apify documentation: the
    Apify client leaves bodies under 1,024 bytes uncompressed and without
    Content-Encoding, so a br request with a smaller body is not Apify's
    default behaviour (the 22-byte trigger seed N2S-01 is far below it).

    Log requirement: the request Content-Encoding header must be logged
    (nginx $http_content_encoding, Apache %{Content-Encoding}i, CDN/WAF request
    logs). The cs-headers-<name> fields follow the php2shell package
    convention; map them to your pipeline.
references:
    - https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/
    - https://nodejs.org/en/blog/vulnerability/october-2026-security-releases
    - https://expressjs.com/en/guide/migrating-5.html
    - https://www.indusface.com/blog/cve-2026-111497-node2shell-nodejs-brotli-rce/
    - https://docs.apify.com/api/client/js/docs/next/concepts/http-compression
author: IONSEC
date: 2026-10-24
modified: 2026-10-24
tags:
    - attack.initial-access
    - attack.t1190
    - cve.2026-111497
    - detection.threat-hunting
logsource:
    category: webserver
detection:
    sel_ce_br:
        # token "br" bounded by start/end, whitespace, comma or semicolon; (?i) = any case
        cs-headers-content-encoding|re: '(?i)(^|[\s,])br([\s,;]|$)'
    sel_body_methods:
        cs-method:
            - 'POST'
            - 'PUT'
            - 'PATCH'
            - 'DELETE'
    sel_body_length:
        cs-headers-content-length|re: '^0*[1-9][0-9]*$'
    sel_body_chunked:
        cs-headers-transfer-encoding|contains: 'chunked'
    condition: sel_ce_br and 1 of sel_body_*
falsepositives:
    - 'Apify JavaScript API client: brotli-compresses request bodies of 1,024 bytes or more by default (docs.apify.com). Only expected on Apify-API-shaped endpoints you operate or proxy; allowlist narrowly by path and source address, or configure the client with compression gzip'
    - 'Custom API clients that pipe uploads through zlib brotliCompress (rare: request-side br is uncommon but not zero per GitHub code search)'
    - 'Authorized exposure scanners (Ostorlab-style differential probes, see web_node2shell_ostorlab_differential_probe.yml)'
level: low
