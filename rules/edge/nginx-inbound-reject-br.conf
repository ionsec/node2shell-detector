# =============================================================================
# IONSEC node2shell detector — nginx INBOUND guard (reverse proxy in front of Node / aiohttp)
# CVE-2026-111497 (Node2Shell) — reject request bodies declared Content-Encoding br
# Compiled: 2026-10-24 · Author: IONSEC · File: nginx-inbound-reject-br.conf
# =============================================================================
# WHAT: answer 415 to any request whose Content-Encoding carries the token br (any case,
#   also inside a list such as "gzip, br") before nginx forwards the body upstream.
#   nginx never decodes request bodies itself, so the backend decoder (body-parser 2,
#   co-body, @fastify/compress, aiohttp ...) never sees the bytes.
# PROVENANCE: N2S-11 (DERIVED, brief section 7); token matching per the vendor
#   workarounds (Aikido: case-insensitive, inside lists; Indusface: list variants).
# WHY 415: the Node ecosystem's own answer for request codings it does not support:
#   body-parser 1.x / Express 4 return 415 for br, body-parser 2.x returns 415 for any
#   coding when inflate is false, inflation and @fastify/compress return 415 for
#   unsupported codings. Clients treat it as "coding not supported", not as a WAF block.
# DUPLICATE HEADERS: nginx >= 1.23.0 joins repeated request headers in $http_* variables
#   with commas, so a br in a second Content-Encoding header is still seen. Older nginx
#   exposes only the FIRST instance - upgrade, or add the ModSecurity drop-in.
# INBOUND ONLY: this cannot see responses your app fetches (fetch/axios/got ...). See
#   nginx-egress-strip-br.conf and the README "coverage map".
# TEST:
#   nginx -t && nginx -s reload
#   curl -si -X POST -H 'Content-Encoding: br'       --data-binary 'x' https://your.host/   -> 415
#   curl -si -X POST -H 'Content-Encoding: gzip, BR' --data-binary 'x' https://your.host/   -> 415
#   curl -si -X POST -H 'Content-Encoding: gzip'     --data-binary 'x' https://your.host/   -> not 415
# =============================================================================

# ---- http {} context ------------------------------------------------------------------
map $http_content_encoding $n2s_ce_br {
    default                        0;
    "~*(^|[\s,])br([\s,;]|$)"      1;
}

# Optional allowlist (known legitimate Brotli senders, e.g. Apify API clients that
# compress bodies >= 1,024 B with brotli by default). Allow ONLY in front of a patched
# decoder. 192.0.2.0/24 is a documentation range - replace it, and make sure
# $remote_addr is the real client (set_real_ip_from / real_ip_header behind a CDN).
geo $n2s_br_trusted_src {
    default          0;
    # 192.0.2.10/32  1;
}

# "10" = br from an untrusted source -> reject; "11" = br from a trusted source -> pass.
map "$n2s_ce_br$n2s_br_trusted_src" $n2s_reject_br {
    default 0;
    "10"    1;
}

# Optional, Indusface-style strict mode: also refuse stacked or merged values
# ("gzip, deflate", or two Content-Encoding headers joined by nginx >= 1.23).
# map $http_content_encoding $n2s_ce_list {
#     default 0;
#     "~,"    1;
# }

