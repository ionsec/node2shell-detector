# =============================================================================
# IONSEC node2shell detector — Apache httpd INBOUND guard (reverse proxy in front of Node / aiohttp)
# CVE-2026-111497 (Node2Shell) — reject request bodies declared Content-Encoding br
# Compiled: 2026-10-24 · Author: IONSEC · File: apache-inbound-reject-br.conf
# =============================================================================
# WHAT: refuse any request whose Content-Encoding carries the token br (any case, also
#   inside a list) before mod_proxy forwards the body. httpd itself never decodes
#   request bodies (mod_brotli is an encoder only and is not affected).
# PROVENANCE: N2S-11 (DERIVED); token matching per the vendor workarounds (Aikido,
#   Indusface). Duplicates: httpd merges repeated request headers into one
#   comma-separated value before these checks run, so a br in either header is seen.
# WHY 415: same answer body-parser 1.x / Express 4 give for br, and body-parser 2.x for any
#   coding with inflate:false (see rules/edge/README.md).
# INBOUND ONLY: responses your app fetches are not visible here (README coverage map).
# TEST: apachectl configtest; then the curl checks from nginx-inbound-reject-br.conf.
# =============================================================================

# ---- Variant 1 (recommended): mod_rewrite, server or <VirtualHost> context -> 415 -------
# A non-3xx R= code drops the substitution and stops rewriting (mod_rewrite docs), so
# "[R=415,L]" answers 415 without redirecting. Works alongside ProxyPass.
<IfModule mod_rewrite.c>
    RewriteEngine On
    # Optional allowlist (known Brotli senders such as Apify API clients; only in front of
    # a patched decoder). 192.0.2.10 is a documentation address - replace it, and restore
    # the real client address first (mod_remoteip) when httpd sits behind a CDN/LB.
    # RewriteCond "%{REMOTE_ADDR}" "!=192.0.2.10"
    RewriteCond "%{HTTP:Content-Encoding}" "(^|[\s,])br([\s,;]|$)" [NC]
    RewriteRule "^" "-" [R=415,L]
</IfModule>

# ---- Variant 2: <If> (httpd 2.4 expression parser) -> 403 ------------------------------
# <If> cannot set an arbitrary status portably; "Require all denied" answers 403. Use it
# where mod_rewrite is not available. Do not enable both variants.
# <If "req('Content-Encoding') =~ /(^|[\s,])br([\s,;]|$)/i">
#     Require all denied
# </If>
