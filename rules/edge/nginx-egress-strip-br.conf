# =============================================================================
# IONSEC node2shell detector — nginx EGRESS guard (outbound responses the app fetches)
# CVE-2026-111497 (Node2Shell) — never hand a Content-Encoding br response to the app
# Compiled: 2026-10-24 · Author: IONSEC · File: nginx-egress-strip-br.conf
# =============================================================================
# THE GAP: services that fetch attacker-chosen URLs (webhooks, link previews / unfurlers,
#   oEmbed, image and avatar proxies, crawlers, SSR of user-supplied URLs, npm through an
#   untrusted registry) decode a Content-Encoding br RESPONSE automatically: Node's
#   built-in fetch() (undici), axios >= 1.0, got, node-fetch 3, needle, superagent, Bun
#   fetch, Python requests/httpx/aiohttp with Brotli installed. A malicious server sends
#   br even when the client did not ask for it. A WAF in front of the app cannot see this
#   direction - Vercel says so explicitly about its own WAF rules (brief section 6).
#
# WHAT THIS DOES (strip, not reject - nginx cannot change the status once upstream
#   headers have arrived without njs/Lua):
#   1. asks upstreams for gzip/deflate only (honest servers then never answer br);
#   2. if an upstream still answers Content-Encoding br, the header is REMOVED before
#      the response reaches the app. The client library then treats the body as
#      identity and never runs its Brotli decoder; the app sees undecodable bytes and
#      an "X-Ionsec-Node2shell: upstream-br-stripped" header - log and alert on it.
#   Gzip/deflate responses keep their Content-Encoding and work as before.
#
# DO NOT "FIX" EGRESS BY DECODING AT A PROXY: Envoy's brotli decompressor filter is itself
#   affected (GHSA-3wvj-j6qm-62mr; fixed 1.36.12 / 1.37.8 / 1.38.6 / 1.39.3 / 1.40.0).
#   nginx ngx_brotli and Apache mod_brotli are encoders only and not affected.
#
# PATTERNS:
#   A. Relay for known upstreams (webhook relay, partner APIs): the app calls
#      http://127.0.0.1:8081/... and nginx originates TLS to the upstream.
#   B. Forward-proxy style for plain-HTTP URLs only (HTTP_PROXY=http://127.0.0.1:3128).
#      Stock nginx does not implement CONNECT; HTTPS through a CONNECT tunnel is opaque to
#      any proxy that does not terminate TLS. For arbitrary HTTPS URLs use a
#      TLS-terminating egress proxy (Envoy, HAProxy, Squid ssl-bump) or the app-level
#      client switches in rules/app/README.md - and patch the runtime.
# =============================================================================

# ---- http {} context ------------------------------------------------------------------
# Upstream Content-Encoding to pass on: unchanged, or empty when it carries the br token
# (an empty add_header value adds no header).
map $upstream_http_content_encoding $n2s_upstream_ce {
    default                        $upstream_http_content_encoding;
    "~*(^|[\s,])br([\s,;]|$)"      "";
}
map $upstream_http_content_encoding $n2s_upstream_br_flag {
    default                        "";
    "~*(^|[\s,])br([\s,;]|$)"      "upstream-br-stripped";
}

# Log what was stripped (add $upstream_http_content_encoding to your egress log_format).
log_format n2s_egress '$time_iso8601 $remote_addr "$request" $status '
                      'upstream_ce="$upstream_http_content_encoding" n2s="$n2s_upstream_br_flag"';

# ---- Pattern A: relay for a known upstream -------------------------------------------
server {
    listen 127.0.0.1:8081;
    access_log /var/log/nginx/n2s-egress.log n2s_egress;

    location / {
        gzip off;                                            # never re-compress here
        proxy_set_header Accept-Encoding "gzip, deflate";    # do not ask for br
        proxy_hide_header Content-Encoding;                  # drop upstream's header...
        add_header Content-Encoding $n2s_upstream_ce always; # ...re-add it unless it was br
        add_header X-Ionsec-Node2shell $n2s_upstream_br_flag always;
        proxy_ssl_server_name on;
        proxy_pass https://api.partner.example;              # replace with your upstream
    }
}

