# =============================================================================
# IONSEC node2shell detector — HAProxy EGRESS guard (responses the app fetches)
# CVE-2026-111497 (Node2Shell) — refuse upstream responses carrying Content-Encoding br
# Compiled: 2026-10-24 · Author: IONSEC · File: haproxy-egress-deny-br.cfg
# =============================================================================
# THE GAP: fetch()/axios/got/node-fetch 3/needle (and Bun fetch, Python requests/httpx/
#   aiohttp with Brotli) decode a Content-Encoding br response automatically, and a
#   malicious server sends br whatever the client asked for. Webhooks, link previews,
#   image proxies, crawlers and SSR of user-supplied URLs are SSRF-shaped: no inbound
#   request is needed and a WAF in front of the app never sees the response (Vercel's
#   caveat about its own WAF rules, brief section 6).
# WHAT: when the app's outbound HTTP goes through this HAProxy (sidecar, egress gateway,
#   relay that originates TLS), any response whose Content-Encoding contains the br token
#   is replaced by a 502 before a single body byte reaches the app's decoder, and the
#   outbound Accept-Encoding no longer offers br (honest upstreams then never send it).
# LIMIT: HAProxy must see the HTTP layer. A CONNECT tunnel carrying TLS end-to-end is
#   opaque; terminate/originate TLS here, or use the app-level client switches
#   (rules/app/README.md) - and patch the runtime.
# DO NOT decode at the proxy instead: Envoy's brotli decompressor filter is itself
#   affected (GHSA-3wvj-j6qm-62mr).
# =============================================================================

backend be_egress_partner_api
    # 1. Do not ask for br: rewrite each comma-separated Accept-Encoding value that is br
    #    (any case, optional parameters) to identity. Strong (single) quotes stop HAProxy
    #    from expanding the "$" in the regex.
    http-request replace-value Accept-Encoding '(?i)^br(;.*)?$' identity

    # 2. Refuse br answers. 502 = "upstream sent something we will not pass on".
    http-response deny deny_status 502 if { res.hdr(content-encoding) -m str -i br }

    # Optional: log it (capture in the frontend log-format with res.hdr(content-encoding)).
    server partner_api api.partner.example:443 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str(api.partner.example)
