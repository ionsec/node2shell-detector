# =============================================================================
# IONSEC node2shell detector — HAProxy INBOUND guard (frontend in front of Node / aiohttp)
# CVE-2026-111497 (Node2Shell) — reject request bodies declared Content-Encoding br
# Compiled: 2026-10-24 · Author: IONSEC · File: haproxy-inbound-reject-br.cfg
# =============================================================================
# WHAT: answer 415 when any Content-Encoding value is the token br (any case), and when
#   the request carries more than one Content-Encoding header line.
# HOW THE FETCHES BEHAVE (HAProxy configuration manual):
#   req.hdr(<name>)      splits values at commas; in an ACL every value of every
#                        instance is tried, so "gzip, br" and a second header both match.
#   req.fhdr_cnt(<name>) counts full header lines (no comma split) -> duplicates.
#   req.hdr_cnt(<name>)  counts comma-separated values -> stacked lists (optional, strict).
# PROVENANCE: N2S-11 (DERIVED) and N2S-13 (VERBATIM vendor logic, Indusface AppTrana:
#   blocks duplicate Content-Encoding headers).
# WHY 415: see rules/edge/README.md. "http-request return" (HAProxy >= 2.2) can send any
#   status with a body and headers. On older HAProxy use the commented deny line (403):
#   415 is not one of the built-in error codes "deny_status" knows.
# INBOUND ONLY: see haproxy-egress-deny-br.cfg for responses your app fetches.
# TEST: haproxy -c -f /etc/haproxy/haproxy.cfg; then the curl checks from the nginx file.
# =============================================================================

frontend fe_web
    # ... your bind / tls / defaults ...

    acl n2s_ce_br    req.hdr(content-encoding) -m str -i br
    acl n2s_ce_dup   req.fhdr_cnt(content-encoding) gt 1
    # acl n2s_ce_list  req.hdr_cnt(content-encoding) gt 1     # strict: any stacked list

    # Optional allowlist (Apify-style legitimate Brotli uploads; only in front of a patched
    # decoder). 192.0.2.10 is a documentation address - replace it. Then append
    # "!n2s_br_trusted" to the n2s_ce_br condition below.
    # acl n2s_br_trusted src 192.0.2.10
    # acl n2s_br_trusted_path path_beg /v2/

    http-request return status 415 content-type "text/plain" string "Unsupported Content-Encoding" hdr "Accept-Encoding" "gzip, deflate" if n2s_ce_br || n2s_ce_dup
    # http-request return status 415 content-type "text/plain" string "Unsupported Content-Encoding" if n2s_ce_list

    # HAProxy < 2.2:
    # http-request deny deny_status 403 if n2s_ce_br || n2s_ce_dup

    default_backend be_node
